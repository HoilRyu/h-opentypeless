plugins { id 'com.android.application' }
android {
    namespace 'dev.hoilryu.hopentypeless.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.hoilryu.hopentypeless.mobile'
        minSdk 28
        targetSdk 36
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        testInstrumentationRunner 'dev.hoilryu.hopentypeless.mobile.SmokeInstrumentation'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        versionCode 9
        versionName '0.3.6'
    }
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake {
        path 'src/main/cpp/CMakeLists.txt'
        version '3.22.1'
        buildStagingDirectory new File(System.getProperty('user.home'), '.local/share/h-opentypeless/android-build/cxx')
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
