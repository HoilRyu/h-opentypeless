plugins { id 'com.android.application' }
def signingFile = new File(System.getenv('H_ANDROID_SIGNING_PROPERTIES') ?: new File(System.getProperty('user.home'), '.local/share/h-opentypeless/signing/android/release-signing.properties').path)
def releaseKeys = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { releaseKeys.load(it) }
def hasReleaseKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseKeys.getProperty(it) }
android {
    namespace 'dev.hoilryu.hopentypeless.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.hoilryu.hopentypeless.mobile'
        minSdk 28
        targetSdk 36
        ndk { abiFilters.addAll((project.findProperty('hReleaseAbis') ?: 'arm64-v8a,armeabi-v7a').split(',')) }
        testInstrumentationRunner 'dev.hoilryu.hopentypeless.mobile.SmokeInstrumentation'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        versionCode 10
        versionName '0.3.7'
    }
    signingConfigs {
        release {
            if (hasReleaseKeys) {
                storeFile file(releaseKeys.getProperty('storeFile'))
                storePassword releaseKeys.getProperty('storePassword')
                keyAlias releaseKeys.getProperty('keyAlias')
                keyPassword releaseKeys.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeys) signingConfig signingConfigs.release
            debuggable false
        }
    }
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake {
        path 'src/main/cpp/CMakeLists.txt'
        version '3.22.1'
        buildStagingDirectory new File(System.getProperty('user.home'), '.local/share/h-opentypeless/android-build/cxx')
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// Fail closed: a release task must never silently emit an unsigned APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } && !hasReleaseKeys) {
        throw new GradleException('Release signing is required. Run scripts/h-prepare-android-signing.py or set H_ANDROID_SIGNING_PROPERTIES.')
    }
}
