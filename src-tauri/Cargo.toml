[package]
name = "opentypeless"
version = "0.1.45-beta.3"
description = "AI-powered speech-to-text and text polishing desktop app"
authors = ["OpenTypeless Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.87"

[lib]
name = "opentypeless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"
axum = { version = "0.8", features = ["multipart"] }
if-addrs = "0.13"
tauri = { version = "=2.11.2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
ogg = "=0.9.2"
opusic-c = "=1.6.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util", "net", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
arboard = "3"
http = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
url = "2"
flate2 = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
earshot = "=1.2.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
block2 = "0.5"
objc2 = { version = "0.5", features = ["exception"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
libloading = "0.8"

[dev-dependencies]
tempfile = "3"
plist = "1"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = "thin"
strip = true

# Multi-GB model verification must stay practical in local debug builds too.
[profile.dev.package.sha2]
opt-level = 3

# RustCrypto 0.10 gates ARM SHA instructions behind asm; runtime feature detection
# retains the software fallback. Keep other platforms' build dependencies unchanged.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# Keep live VAD fast in locally installed debug builds.
[profile.dev.package.earshot]
opt-level = 3

[target.'cfg(unix)'.dependencies]
libc = "0.2"
